# Puerto del servidor. Railway puede inyectar PORT; local usa 8080.
server.port=${PORT:8080}

# Base de datos PostgreSQL. Las variables de entorno tienen prioridad.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://switchback.proxy.rlwy.net:47735/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:uAsyxqREqNoPICOGEwHKyWKDiszqyhTP}

# Hibernate mantiene el esquema sin borrar datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Usuarios demo: se crean solo si faltan; nunca se borra la tabla al arrancar.
sigeu.seed-demo-users=true

# JWT gradual: se emite y acepta token, pero no bloquea endpoints hasta activar esta variable.
sigeu.jwt.secret=${SIGEU_JWT_SECRET:change-this-secret-before-enforcing-auth}
sigeu.jwt.expiration-seconds=${SIGEU_JWT_EXPIRATION_SECONDS:86400}
sigeu.auth.require-token=${SIGEU_AUTH_REQUIRE_TOKEN:false}

# Proteccion basica contra spam de peticiones por IP.
sigeu.rate-limit.enabled=${SIGEU_RATE_LIMIT_ENABLED:true}
sigeu.rate-limit.auth-per-minute=${SIGEU_RATE_LIMIT_AUTH_PER_MINUTE:10}
sigeu.rate-limit.reports-per-minute=${SIGEU_RATE_LIMIT_REPORTS_PER_MINUTE:20}
sigeu.rate-limit.api-per-minute=${SIGEU_RATE_LIMIT_API_PER_MINUTE:120}

# Simulacion operativa: asigna recursos, resuelve y limpia casos automaticamente.
sigeu.workflow.enabled=${SIGEU_WORKFLOW_ENABLED:true}
sigeu.workflow.resolve-minutes=${SIGEU_WORKFLOW_RESOLVE_MINUTES:15}
sigeu.workflow.high-priority-resolve-minutes=${SIGEU_WORKFLOW_HIGH_PRIORITY_RESOLVE_MINUTES:10}
sigeu.workflow.delete-after-resolve-minutes=${SIGEU_WORKFLOW_DELETE_AFTER_RESOLVE_MINUTES:10}
sigeu.workflow.tick-ms=${SIGEU_WORKFLOW_TICK_MS:60000}
sigeu.resources.policia=${SIGEU_RESOURCES_POLICIA:30}
sigeu.resources.hospital=${SIGEU_RESOURCES_HOSPITAL:15}
sigeu.resources.bomberos=${SIGEU_RESOURCES_BOMBEROS:8}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
