server.port=0

spring.datasource.url=jdbc:h2:mem:sigeu_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

sigeu.seed-demo-users=false
sigeu.jwt.secret=test-secret
sigeu.jwt.expiration-seconds=86400
sigeu.auth.require-token=false
sigeu.rate-limit.enabled=false
sigeu.rate-limit.auth-per-minute=10
sigeu.rate-limit.reports-per-minute=20
sigeu.rate-limit.api-per-minute=120
sigeu.workflow.enabled=true
sigeu.workflow.resolve-minutes=15
sigeu.workflow.high-priority-resolve-minutes=10
sigeu.workflow.delete-after-resolve-minutes=10
sigeu.workflow.tick-ms=600000
sigeu.resources.policia=30
sigeu.resources.hospital=15
sigeu.resources.bomberos=8
sigeu.resources.daily-add-limit=10
sigeu.resources.daily-remove-limit=10
